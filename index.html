<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator & Game App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 70px;
        }
        .navbar-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-link-custom {
            color: #94a3b8;
            text-align: center;
            padding: 10px;
            display: block;
            text-decoration: none;
            font-size: 12px;
        }
        .nav-link-custom.active, .nav-link-custom:hover {
            color: #38bdf8;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="container py-3 d-flex justify-content-between align-items-center">
        <h4 class="m-0 fw-bold text-info"><i class="fa-solid fa-plane-departure"></i> Aviator</h4>
        <div class="d-flex align-items-center bg-dark px-3 py-1 rounded-pill border border-secondary">
            <span class="text-warning me-1">৳</span>
            <span id="userBalance" class="fw-bold">4,215</span>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container my-2">
        
        <!-- Referral Banner -->
        <div class="card card-custom p-3 mb-3">
            <div class="d-flex align-items-center">
                <div class="flex-grow-1">
                    <small class="text-warning fw-bold"><i class="fa-solid fa-gift"></i> REFERRAL PROGRAM</small>
                    <h6 class="mb-1 fw-bold">রেফার করুন, পান ৬৩০০ বোনাস!</h6>
                    <p class="text-muted small mb-0" style="font-size: 11px;">বন্ধুকে ইনভাইট করুন, সে ২০০০ টাকা ডিপোজিট করলেই আপনি পাবেন ৬৩০০৳।</p>
                </div>
                <div class="ms-2 text-warning fs-3">
                    <i class="fa-solid fa-handshake"></i>
                </div>
            </div>
            <button class="btn btn-warning w-100 mt-2 fw-bold text-dark">REFER & EARN</button>
        </div>

        <!-- Dynamic Games Section (Admin Panel থেকে আপলোড করা গেমগুলো এখানে শো করবে) -->
        <div class="mb-3">
            <h5 class="fw-bold mb-2">Games</h5>
            <div id="userGameContainer" class="row g-2">
                <!-- ফায়ারবেस থেকে গেমগুলো ডাইনামিক্যালি এখানে লোড হবে -->
            </div>
        </div>

        <!-- Default Aviator Game Card (আগের Aviator গেম যেমন ছিল) -->
        <div class="card card-custom p-3 mb-3">
            <div class="d-flex align-items-center mb-2">
                <i class="fa-solid fa-plane text-info fs-4 me-2"></i>
                <h6 class="m-0 fw-bold">Aviator</h6>
            </div>
            <p class="text-muted small">বিমান উড়বে, multiplier বাড়বে এবং round crash হবে।</p>
            <button onclick="alert('Opening Aviator Game...')" class="btn btn-success w-100 fw-bold">OPEN GAME</button>
        </div>

        <!-- Recent Crash Section -->
        <div class="card card-custom p-3">
            <h6 class="fw-bold mb-2"><i class="fa-solid fa-chart-column"></i> Recent Crash</h6>
            <div class="d-flex justify-content-between align-items-center bg-dark p-2 rounded text-muted">
                <span>Round</span>
                <span class="text-warning">Waiting...</span>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="navbar-bottom">
        <div class="row g-0 text-center">
            <div class="col-4">
                <a href="index.html" class="nav-link-custom active">
                    <i class="fa-solid fa-house fs-5"></i><br>Home
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="nav-link-custom" onclick="alert('Game section')">
                    <i class="fa-solid fa-gamepad fs-5"></i><br>Game
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="nav-link-custom" onclick="alert('Profile section')">
                    <i class="fa-solid fa-user fs-5"></i><br>Profile
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // আপনার ফায়ারবেস কনফিগারেশন এখানে ঠিকঠাক আছে কিনা নিশ্চিত করুন
        const firebaseConfig = {
            databaseURL: "https://YOUR_FIREBASE_DATABASE_URL.firebaseio.com" // আপনার প্রজেক্টের লিংক এখানে বসানো থাকবে
        };

        // যদি ফায়ারবেস আগে থেকেই ইনিশিয়ালাইজ করা না থাকে তবে ইনিলাইজ করুন
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // রিয়েল-টাইমে এডমিন প্যানেল থেকে গেম লোড করার ফাংশন
        firebase.database().ref('games').on('value', (snapshot) => {
            const container = document.getElementById('userGameContainer');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if(data) {
                Object.keys(data).forEach(key => {
                    const game = data[key];
                    if(game.status === 'active') {
                        container.innerHTML += `
                            <div class="col-4 text-center">
                                <div class="card card-custom p-2 h-100 shadow-sm" onclick="location.href='${game.link}'" style="cursor:pointer;">
                                    <img src="${game.image}" class="img-fluid rounded mb-1 mx-auto" style="height: 50px; width: 50px; object-fit: cover;">
                                    <small class="fw-bold text-truncate d-block">${game.name}</small>
                                </div>
                            </div>
                        `;
                    }
                });
            } else {
                container.innerHTML = '<p class="text-center text-muted small col-12">No extra games available right now.</p>';
            }
        });
    </script>
</body>
</html>
